name: simpeg_kpi_mobile
description: "SIMPEG-KPI — Aplikasi mobile pegawai KPI Pusat"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Local storage (auth token, cache)
  shared_preferences: ^2.3.3

  # Location & camera for absensi
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  permission_handler: ^11.3.1

  # UI polish
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app-icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/bg-login.png
    - assets/images/logo-kpi.png
    - assets/icon/app-icon.png
